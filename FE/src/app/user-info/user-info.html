<div class="profile-container">
  
  <header class="page-header">
    <div class="header-text">
      <h2 class="page-title">Hồ sơ thực tập sinh</h2>
      <p class="page-subtitle">Quản lý thông tin cá nhân và học vấn của bạn.</p>
    </div>
    <button class="btn-update" (click)="toggleEditMode()">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
      {{ isEditMode() ? 'Lưu thông tin' : 'Cập nhật thông tin' }}
    </button>
  </header>

  <div class="profile-grid">
    
    <div class="left-column">
      
      <div class="profile-card">
        <div class="card-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          Thông tin cơ bản
        </div>
        
        <div class="form-grid">
          <div class="form-group">
            <label>Họ và tên <span class="text-danger">*</span></label>
            <input type="text" [(ngModel)]="profile().fullName" [readonly]="!isEditMode()">
          </div>
          <div class="form-group">
            <label>Giới tính <span class="text-danger">*</span></label>
            <select [(ngModel)]="profile().gender" [disabled]="!isEditMode()">
              <option value="Nam">Nam</option>
              <option value="Nữ">Nữ</option>
            </select>
          </div>
          <div class="form-group">
            <label>Ngày sinh <span class="text-danger">*</span></label>
            <input type="date" [(ngModel)]="profile().dob" [readonly]="!isEditMode()">
          </div>
          <div class="form-group">
            <label>Số điện thoại <span class="text-danger">*</span></label>
            <input type="tel" [(ngModel)]="profile().phone" [readonly]="!isEditMode()">
          </div>
          <div class="form-group">
            <label>Email cá nhân <span class="text-danger">*</span></label>
            <input type="email" [(ngModel)]="profile().personalEmail" [readonly]="!isEditMode()">
          </div>
          <div class="form-group">
            <label>Email trường</label>
            <input type="email" [(ngModel)]="profile().schoolEmail" [readonly]="!isEditMode()" >
          </div>
        </div>

        <div class="form-group full-width mt-16">
          <label>Địa chỉ hiện tại</label>
          <input type="text" [(ngModel)]="profile().currentAddress" [readonly]="!isEditMode()">
        </div>
        
        <div class="form-group full-width mt-16">
          <label>Facebook URL</label>
          <input type="text" [(ngModel)]="profile().facebookUrl" [readonly]="!isEditMode()" class="text-link">
        </div>
      </div>

      <div class="profile-card">
        <div class="card-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
          Thông tin học vấn
        </div>
        
        <div class="form-grid">
          <div class="form-group">
            <label>Trường đại học <span class="text-danger">*</span></label>
            <input type="text" [(ngModel)]="profile().university" [readonly]="!isEditMode()">
          </div>
          <div class="form-group">
            <label>Mã số sinh viên (MSSV)</label>
            <input type="text" [(ngModel)]="profile().studentId" [readonly]="!isEditMode()">
          </div>
          <div class="form-group">
            <label>Ngành học</label>
            <input type="text" [(ngModel)]="profile().major" [readonly]="!isEditMode()">
          </div>
          <div class="form-group">
            <label>Vị trí thực tập <span class="text-danger">*</span></label>
            <input type="text" [(ngModel)]="profile().internPosition" >
          </div>
          <div class="form-group">
            <label>GPA (Hệ 4.0)</label>
            <input type="text" [(ngModel)]="profile().gpa" [readonly]="!isEditMode()">
          </div>
          <div class="form-group">
            <label>Trình độ tiếng Anh</label>
            <input type="text" [(ngModel)]="profile().englishSkill" [readonly]="!isEditMode()">
          </div>
        </div>
      </div>
    </div>

    <div class="right-column">
      
      <div class="profile-card">
        <div class="card-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
          Thông tin thực tập
        </div>
        <div class="form-group mb-16">
          <label>Ngày bắt đầu</label>
          <input type="text" [(ngModel)]="profile().startDate" >
        </div>
        <div class="form-group">
          <label>Thời gian thực tập</label>
          <div class="input-with-badge">
            <input type="text" [(ngModel)]="profile().duration" >
            <span class="badge-status">{{ profile().internStatus }}</span>
          </div>
        </div>
      </div>

      <div class="profile-card">
        <div class="card-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          Thông tin định danh
        </div>
        <div class="form-group mb-16">
          <label>Số CCCD <span class="text-danger">*</span></label>
          <input type="text" [(ngModel)]="profile().idCardNumber" [readonly]="!isEditMode()">
        </div>
        <div class="form-group mb-16">
          <label>Ngày cấp</label>
          <input type="date" [(ngModel)]="profile().idIssueDate" [readonly]="!isEditMode()">
        </div>
        <div class="form-group">
          <label>Nơi cấp</label>
          <input type="text" [(ngModel)]="profile().idIssuePlace" [readonly]="!isEditMode()" class="bg-readonly">
        </div>
      </div>

      <div class="profile-card">
        <div class="card-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="10" x2="3" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="21" y1="18" x2="3" y2="18"></line></svg>
          Giới thiệu & CV
        </div>
        <div class="form-group mb-16">
          <label>Giới thiệu bản thân</label>
          <textarea rows="5" [(ngModel)]="profile().bio" [readonly]="!isEditMode()"></textarea>
        </div>
        <div class="form-group">
          <label>Link CV (Portfolio)</label>
          <div class="link-wrapper">
            <svg class="link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            <input type="text" [(ngModel)]="profile().cvLink" [readonly]="!isEditMode()" class="text-link pl-32">
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
